[project]
name = "hive-common"
version = "1.0.0"
description = "Shared infrastructure utilities for Hive agents"
requires-python = ">=3.12"
dependencies = [
  "PyJWT>=2.10,<3",
  "cryptography>=49,<51",
  "httpx>=0.28,<1",
  "starlette>=0.40,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
