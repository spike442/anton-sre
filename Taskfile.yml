version: '3'

includes:
  anton:
    taskfile: ./anton/Taskfile.yml
    dir: ./anton
  sensei:
    taskfile: ./sensei/Taskfile.yml
    dir: ./sensei
  hive:
    taskfile: ./hive/Taskfile.yml
    dir: ./hive

tasks:
  setup:
    desc: Set up every agent environment
    cmds:
      - task: tools:install
      - task: anton:setup
      - task: sensei:setup
      - task: hive:setup

  tools:install:
    desc: Install the shared pinned CLI tools
    cmds:
      - aqua install

  s3:upload:
    desc: Upload all agent prompts to S3
    cmds:
      - task: anton:prompts:upload
      - task: sensei:prompts:upload

  database:apply:
    desc: Apply every SQL schema to the shared Hive database
    cmds:
      - task: anton:database:apply
      - task: sensei:database:apply
      - task: hive:database:apply
