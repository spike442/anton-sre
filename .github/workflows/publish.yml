name: Publish

env:
  DOCKER_BUILD_SUMMARY: false

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: anton-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read project version
        id: version
        shell: bash
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        uses: actions/github-script@v8
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = process.env.RELEASE_VERSION;
            const commitSha = process.env.RELEASE_SHA;
            try {
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`,
              });
              if (existing.data.object.sha !== commitSha) {
                core.setFailed(`${tagName} already exists on another commit`);
              } else {
                core.info(`${tagName} already points to this commit`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: commitSha,
              });
              core.info(`Created ${tagName}`);
            }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/anton
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            ANTON_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
